# ════════════════════════════════════════════════════════════════════════════════
#  APHURA SOVEREIGN PLATFORM — PRODUCTION DOCKER COMPOSE STACK
# ════════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ── 1. Redis Cache & BullMQ Queue ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aphura-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sovereign_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sovereign_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Core API Backend Service ───────────────────────────────────────────
  backend:
    build:
      context: ./Aphura Backend
      dockerfile: Dockerfile
    container_name: aphura-backend
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - NODE_ENV=production
      - PORT=5100
      - DATABASE_LOCAL=${MONGODB_URI}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sovereign_redis_pass}@redis:6379
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/aphura-backend/uploads
      - backend_logs:/app/aphura-backend/logs

  # ── 3. Next.js Web Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aphura-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5100/api/v1
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - backend

  # ── 4. Sovereign Autonomous Daemons Supervisor ─────────────────────────────
  daemons:
    build:
      context: ./Aphura Backend
      dockerfile: Dockerfile
    container_name: aphura-daemons
    restart: unless-stopped
    command: ["node", "scripts/daemons/supervisor.js"]
    environment:
      - NODE_ENV=production
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY}
    depends_on:
      - backend
      - redis

volumes:
  redis_data:
  backend_uploads:
  backend_logs:
